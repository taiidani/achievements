[env]
# Place a STEAM_KEY into this file
_.file = ".env"
PORT = "3000"
DEV = "true"
DATABASE_URL = "postgresql://postgres:root@5432/achievements"
REDIS_ADDR = "127.0.0.1:6379"

[tools]
go = "1.24"
staticcheck = "latest"

[tasks.default]
description = "Execute the app in development mode"
depends = ["build", "docker"]
depends_post = ["clean"]
run = ["./app"]

[tasks.build]
description = "Build the server binary"
env.CGO_ENABLED = "0"
depends = ["test", "lint"]
run = ["go build -o app main.go"]

[tasks.docker]
run = ["docker compose up -d --wait"]

[tasks.clean]
run = ["docker compose down", "rm -f app"]

[tasks.test]
description = "Run the unit test suite"
env.CGO_ENABLED = 1                                    # Required for -race
run = ["go test -race -covermode=atomic -cover ./..."]

[tasks.integration_test]
description = "Run the integration test suite"
run = ["go test --tags='integration' ./..."]

[tasks.lint]
run = ["go vet ./...", "staticcheck ./..."]
